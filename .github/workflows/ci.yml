name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      # Proves that the installer script still compiles. The file is kept
      # for a few days so it can be tried by hand; releases build their own.
      - name: Build the installer
        shell: pwsh
        run: installer\build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7
